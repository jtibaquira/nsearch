ftp:
  stages:
    - name: discovery
      arguments: "-sn"
    - name: ports
      from: live_hosts
      arguments: "--top-ports 1000"
    - name: services
      from: open_ports
      arguments: "-sV"
    - name: ftp_enum
      from: services
      when: {service: [ftp, ftps]}
      arguments: "--script ftp-anon,ftp-syst"
